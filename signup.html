<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up — Spendlens</title>
  <meta name="description" content="Spendlens - Smart subscription management">
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet">
</head>

<body>

  <!-- Back Button -->
  <button type="button" class="auth-back-btn" onclick="goBack()">
    <span>←</span>
    <span>Back</span>
  </button>

  <div class="auth-page">
    <div class="auth-card">

      <div class="auth-logo">
        <a href="index.html" class="auth-logo-text" style="text-decoration:none;">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M12 2L2 7l10 5 10-5-10-5z" />
            <path d="M2 17l10 5 10-5" />
            <path d="M2 12l10 5 10-5" />
          </svg>
          <span class="logo-accent">Spendlens</span>
        </a>
      </div>

      <h1 class="auth-title">Create your account</h1>

      <p class="auth-subtitle">
        Start tracking and saving on subscriptions in minutes
      </p>

      <div id="signupError"
        style="display:none;background:#FEF2F2;border:1px solid #FECACA;color:#DC2626;padding:12px 16px;border-radius:8px;font-size:0.88rem;font-weight:600;margin-bottom:20px;">
      </div>

      <form id="signupForm">

        <div class="form-group">
          <label class="form-label" for="signupName">Full Name</label>
          <input class="form-input" type="text" id="signupName" placeholder="Enter Your Name" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="signupEmail">Email Address</label>
          <input class="form-input" type="email" id="signupEmail" placeholder="you@example.com" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="signupPassword">Password</label>
          <input class="form-input" type="password" id="signupPassword" placeholder="Min. 6 characters" required
            minlength="6">
        </div>

        <button type="submit" class="btn btn-primary" style="width:100%;margin-top:8px;padding:13px;">
          Create Account
        </button>

      </form>

      <p class="auth-footer-text">
        Already have an account?
        <a href="login.html">Sign in</a>
      </p>

    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="script.js"></script>

  <script>

    /* =========================================
       BACK BUTTON
       ========================================= */

    function goBack() {

      /*
       * If the user came from another page,
       * go back to that page.
       *
       * Examples:
       *
       * features.html → signup.html → Back
       *                    ↓
       *                features.html
       *
       * login.html → signup.html → Back
       *                 ↓
       *             login.html
       *
       * index.html → signup.html → Back
       *                 ↓
       *             index.html
       */

      if (window.history.length > 1) {
        window.history.back();
      } else {
        // Fallback if there is no previous page
        window.location.href = "index.html";
      }
    }


    /* =========================================
       SIGN UP FORM
       ========================================= */

    document.getElementById("signupForm").addEventListener("submit", async function (e) {
      e.preventDefault();

      const nameInput = document.getElementById("signupName");
      const emailInput = document.getElementById("signupEmail");
      const passwordInput = document.getElementById("signupPassword");
      const submitBtn = this.querySelector('button[type="submit"]');
      const err = document.getElementById("signupError");

      const name = nameInput.value.trim();
      const email = emailInput.value.trim();
      const password = passwordInput.value;

      // 1. Reset error state
      err.style.display = "none";
      err.textContent = "";

      // 2. Client-side basic validation
      if (!name || !email || !password) {
        err.textContent = "Please fill in all fields (name, email, password).";
        err.style.display = "block";
        return;
      }

      if (password.length < 6) {
        err.textContent = "Password must be at least 6 characters long.";
        err.style.display = "block";
        return;
      }

      // 3. UI feedback during network request
      const originalBtnText = submitBtn.textContent;
      submitBtn.disabled = true;
      submitBtn.textContent = "Creating Account...";

      try {
        const response = await fetch(`${API_BASE_URL}/api/auth/signup`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ name, email, password })
        });

        const data = await response.json();

        if (!response.ok) {
          err.textContent = data.error || "Failed to create account. Please try again.";
          err.style.display = "block";
          submitBtn.disabled = false;
          submitBtn.textContent = originalBtnText;
          return;
        }

        // 4. Save session: store public user info and JWT token only (never passwords)
        localStorage.removeItem(STORAGE.demoMode);
        localStorage.removeItem(STORAGE.demoOrigin);
        setAuthSession(data.user, data.token);

        // 5. Success notification & redirect to dashboard
        showToast("Account created successfully! Welcome to Spendlens.");
        setTimeout(() => {
          window.location.href = "dashboard.html";
        }, 450);

      } catch (networkError) {
        err.textContent = "Unable to connect to server. Please verify backend is running on port 5000.";
        err.style.display = "block";
        submitBtn.disabled = false;
        submitBtn.textContent = originalBtnText;
      }
    });

  </script>

</body>

</html>
