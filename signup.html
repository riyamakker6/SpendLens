<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up — Spendlens</title>
  <meta name="description" content="Spendlens - Smart subscription management">
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet">
</head>

<body>

  <!-- Back Button -->
  <button type="button" class="auth-back-btn" onclick="goBack()">
    <span>←</span>
    <span>Back</span>
  </button>

  <div class="auth-page">
    <div class="auth-card">

      <div class="auth-logo">
        <a href="index.html" class="auth-logo-text" style="text-decoration:none;">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M12 2L2 7l10 5 10-5-10-5z" />
            <path d="M2 17l10 5 10-5" />
            <path d="M2 12l10 5 10-5" />
          </svg>
          <span class="logo-accent">Spendlens</span>
        </a>
      </div>

      <h1 class="auth-title">Create your account</h1>

      <p class="auth-subtitle">
        Start tracking and saving on subscriptions in minutes
      </p>

      <div id="signupError"
        style="display:none;background:#FEF2F2;border:1px solid #FECACA;color:#DC2626;padding:12px 16px;border-radius:8px;font-size:0.88rem;font-weight:600;margin-bottom:20px;">
      </div>

      <form id="signupForm">

        <div class="form-group">
          <label class="form-label" for="signupName">Full Name</label>
          <input class="form-input" type="text" id="signupName" placeholder="Enter Your Name" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="signupEmail">Email Address</label>
          <input class="form-input" type="email" id="signupEmail" placeholder="you@example.com" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="signupPassword">Password</label>
          <input class="form-input" type="password" id="signupPassword" placeholder="Min. 6 characters" required
            minlength="6">
        </div>

        <button type="submit" class="btn btn-primary" style="width:100%;margin-top:8px;padding:13px;">
          Create Account
        </button>

      </form>

      <p class="auth-footer-text">
        Already have an account?
        <a href="login.html">Sign in</a>
      </p>

    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="script.js"></script>

  <script>

    /* =========================================
       BACK BUTTON
       ========================================= */

    function goBack() {

      /*
       * If the user came from another page,
       * go back to that page.
       *
       * Examples:
       *
       * features.html → signup.html → Back
       *                    ↓
       *                features.html
       *
       * login.html → signup.html → Back
       *                 ↓
       *             login.html
       *
       * index.html → signup.html → Back
       *                 ↓
       *             index.html
       */

      if (window.history.length > 1) {
        window.history.back();
      } else {
        // Fallback if there is no previous page
        window.location.href = "index.html";
      }
    }


    /* =========================================
       SIGN UP FORM
       ========================================= */


    document.getElementById("signupForm").addEventListener("submit", async function (e) {
      e.preventDefault();

      const name = document.getElementById("signupName").value.trim();
      const email = document.getElementById("signupEmail").value.trim().toLowerCase();
      const password = document.getElementById("signupPassword").value;
      const err = document.getElementById("signupError");

      err.style.display = "none";

      try {
        const response = await fetch("http://127.0.0.1:5000/api/auth/signup", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          credentials: "include",
          body: JSON.stringify({ name, email, password })
        });

        const data = await response.json();

        if (!response.ok) {
          err.style.display = "block";
          err.textContent =
            response.status === 409
              ? "An account with this email already exists."
              : data.message || "Unable to create your account.";
          return;
        }

        // Keep only the logged-in user's details in browser storage.
        // The account and password hash are stored in MongoDB.
        localStorage.removeItem(STORAGE.demoMode);
        localStorage.removeItem(STORAGE.demoOrigin);
        setCurrentUser(data);

        showToast("Account created successfully! Welcome to SpendLens.");

        setTimeout(() => {
          window.location.href = "dashboard.html";
        }, 450);

      } catch (error) {
        err.style.display = "block";
        err.textContent =
          "Cannot connect to the server. Please make sure the backend is running.";
      }
    });


  </script>

</body>

</html>
