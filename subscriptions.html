<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Subscriptions — Spendlens</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
<div class="app-layout">
  <div class="mobile-header">
    <a href="index.html" class="mobile-logo"><span class="logo-accent">Spendlens</span></a>
    <button class="menu-btn" id="menuBtn" aria-label="Toggle menu">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
  </div>
  <aside class="sidebar" id="sidebar">
    <a href="index.html" class="sidebar-logo">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
      <span class="logo-accent">Spendlens</span>
    </a>
    <nav class="sidebar-nav">
      <a href="dashboard.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>Dashboard</a>
      <a href="subscriptions.html" class="active"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>Subscriptions</a>
      <a href="optimizer.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>Cost Leak Detector</a>
      <a href="insights.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>Analytics</a>
    </nav>
    <div class="sidebar-bottom">
      <a href="profile.html">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
        Profile &amp; Settings
      </a>
    </div>
  </aside>
  <main class="main-content">
    <div class="container-fluid">

      <div class="page-header">
        <div>
          <span class="badge">Manage</span>
          <h1>My Subscriptions</h1>
          <p>Search, filter and manage your recurring payments.</p>
        </div>
        <div class="quick-actions">
          <a href="add-subscription.html" class="btn btn-primary">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            Add Subscription
          </a>
        </div>
      </div>

      <div class="filter-panel">
        <div class="form-group"><label>Search</label><input type="search" id="searchInput" placeholder="Search subscriptions..."></div>
        <div class="form-group"><label>Category</label>
          <select id="categoryFilter">
            <option value="">All Categories</option>
            <option>Entertainment</option><option>Music</option><option>Video Streaming</option>
            <option>Productivity</option><option>Cloud Storage</option><option>Gaming</option>
            <option>Fitness</option><option>Education</option><option>Shopping</option>
            <option>Finance</option><option>Other</option>
          </select>
        </div>
        <div class="form-group"><label>Status</label>
          <select id="statusFilter">
            <option value="">All Status</option>
            <option>Active</option><option>Paused</option><option>Cancelled</option>
          </select>
        </div>
        <div class="form-group"><label>Sort By</label>
          <select id="sortBy">
            <option value="name">Name</option>
            <option value="cost">Monthly Cost</option>
            <option value="date">Renewal Date</option>
          </select>
        </div>
      </div>

      <div class="subscription-table-wrapper">
        <table class="subscription-table">
          <thead>
            <tr>
              <th>Service</th>
              <th>Category</th>
              <th>Monthly Cost</th>
              <th>Billing Cycle</th>
              <th>Next Renewal</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="subscriptionTableBody"></tbody>
        </table>
      </div>
      <div id="emptySubscriptions"></div>

    </div>
  </main>
</div>
<div id="toast" class="toast"></div>
<script src="script.js"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
  if (!requireLogin()) return;

  function renderTable() {
    const subs = getUserSubscriptions();
    const search = (document.getElementById("searchInput").value || "").toLowerCase().trim();
    const catFilter = document.getElementById("categoryFilter").value;
    const statusFilter = document.getElementById("statusFilter").value;
    const sortBy = document.getElementById("sortBy").value;

    let filtered = subs.filter(s => {
      const nameMatch = (s.name || "").toLowerCase().includes(search);
      const catMatch = (s.category || "").toLowerCase().includes(search);
      if (search && !nameMatch && !catMatch) return false;
      if (catFilter && s.category !== catFilter) return false;
      if (statusFilter && s.status !== statusFilter) return false;
      return true;
    });

    if (sortBy === "cost") {
      filtered.sort((a, b) => {
        const costA = Number(a.monthlyCost) || calculateMonthlyCost(a.cost, a.billingCycle);
        const costB = Number(b.monthlyCost) || calculateMonthlyCost(b.cost, b.billingCycle);
        return costB - costA;
      });
    } else if (sortBy === "date") {
      filtered.sort((a, b) => new Date(a.renewalDate || "9999-12-31") - new Date(b.renewalDate || "9999-12-31"));
    } else {
      filtered.sort((a, b) => (a.name || "").localeCompare(b.name || ""));
    }

    const tbody = document.getElementById("subscriptionTableBody");
    const empty = document.getElementById("emptySubscriptions");

    if (!filtered.length) {
      tbody.innerHTML = "";
      empty.innerHTML = `<div class="empty-state">
        <div class="empty-icon">📋</div>
        <h3>No subscriptions found</h3>
        <p>Try adjusting your filters or add a new subscription to start tracking.</p>
        <a href="add-subscription.html" class="btn btn-primary" style="margin-top:8px;">Add Subscription</a>
      </div>`;
    } else {
      empty.innerHTML = "";
      tbody.innerHTML = filtered.map(s => {
        const monthly = Number(s.monthlyCost) || calculateMonthlyCost(s.cost, s.billingCycle);
        const initial = (s.name || "S")[0].toUpperCase();
        const status = s.status || "Active";
        const cycleInfo = s.billingCycle === "Yearly" ? ` (₹${s.cost}/yr)` : s.billingCycle === "Weekly" ? ` (₹${s.cost}/wk)` : "";

        return `<tr>
          <td>
            <div style="display:flex;align-items:center;gap:12px;">
              <div style="width:36px;height:36px;border-radius:10px;background:var(--primary-light);display:flex;align-items:center;justify-content:center;font-size:1.05rem;font-weight:700;color:var(--primary-dark);flex-shrink:0;">
                ${escapeHTML(initial)}
              </div>
              <div>
                <div style="font-weight:600;color:var(--text);font-size:0.95rem;">${escapeHTML(s.name)}</div>
                <div style="font-size:0.75rem;color:var(--muted);">${escapeHTML(s.paymentMethod || "Recurring")} ${s.priority ? '• ' + escapeHTML(s.priority) : ''}</div>
              </div>
            </div>
          </td>
          <td><span style="font-weight:500;color:var(--text-2);">${escapeHTML(s.category || "Other")}</span></td>
          <td style="font-weight:700;color:var(--text);">${money(monthly)}</td>
          <td>${escapeHTML(s.billingCycle || "Monthly")}<span style="font-size:0.75rem;color:var(--muted);">${cycleInfo}</span></td>
          <td>${s.renewalDate ? formatDate(s.renewalDate) : "—"}</td>
          <td><span class="status ${status.toLowerCase()}">${escapeHTML(status)}</span></td>
          <td class="table-actions">
            <a href="add-subscription.html?id=${encodeURIComponent(s.id)}" class="btn btn-secondary btn-sm">Edit</a>
            <button class="btn btn-danger btn-sm" onclick="deleteSub('${escapeHTML(s.id)}')">Delete</button>
          </td>
        </tr>`;
      }).join("");
    }
  }

  window.deleteSub = function(id) {
    if (!confirm("Are you sure you want to delete this subscription?")) return;
    const subs = getUserSubscriptions().filter(s => s.id !== id);
    saveUserSubscriptions(subs);
    renderTable();
    showToast("Subscription deleted successfully.");
  };

  ["searchInput", "categoryFilter", "statusFilter", "sortBy"].forEach(id => {
    const el = document.getElementById(id);
    if (el) {
      el.addEventListener("input", renderTable);
      el.addEventListener("change", renderTable);
    }
  });

  renderTable();
});
</script>
</body>
</html>
