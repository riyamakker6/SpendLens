<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Subscription — Spendlens</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
<div class="app-layout">
  <div class="mobile-header">
    <a href="index.html" class="mobile-logo"><span class="logo-accent">Spendlens</span></a>
    <button class="menu-btn" id="menuBtn" aria-label="Toggle menu">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
  </div>
  <aside class="sidebar" id="sidebar">
    <a href="index.html" class="sidebar-logo">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
      <span class="logo-accent">Spendlens</span>
    </a>
    <nav class="sidebar-nav">
      <a href="dashboard.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>Dashboard</a>
      <a href="subscriptions.html" class="active"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>Subscriptions</a>
      <a href="optimizer.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>Cost Leak Detector</a>
      <a href="insights.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>Analytics</a>
    </nav>
    <div class="sidebar-bottom">
      <a href="profile.html">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
        Profile &amp; Settings
      </a>
    </div>
  </aside>
  <main class="main-content">
    <div class="container-fluid">

      <div class="page-header">
        <div>
          <span class="badge" id="formBadge">New Subscription</span>
          <h1 id="pageTitle">Add Subscription</h1>
          <p id="pageSubtitle">Track a new recurring payment and optimize your expenses.</p>
        </div>
      </div>

      <div class="form-section">
        <div id="addError" style="display:none;background:#FEF2F2;border:1px solid #FECACA;color:#DC2626;padding:12px 16px;border-radius:8px;font-weight:600;margin-bottom:20px;"></div>

        <form id="subscriptionForm">
          <div class="form-group">
            <label for="subName">Subscription Name <span style="color:var(--danger)">*</span></label>
            <input type="text" id="subName" placeholder="e.g. Netflix, Spotify, AWS" required>
          </div>

          <div class="form-group">
            <label for="subCategory">Category <span style="color:var(--danger)">*</span></label>
            <select id="subCategory" required>
              <option value="">Select category</option>
              <option value="Entertainment">Entertainment</option>
              <option value="Music">Music</option>
              <option value="Video Streaming">Video Streaming</option>
              <option value="Productivity">Productivity</option>
              <option value="Cloud Storage">Cloud Storage</option>
              <option value="Gaming">Gaming</option>
              <option value="Fitness">Fitness</option>
              <option value="Education">Education</option>
              <option value="Shopping">Shopping</option>
              <option value="Finance">Finance</option>
              <option value="Other">Other</option>
            </select>
          </div>

          <div id="customCategoryGroup" class="form-group" style="display:none;">
            <label for="customCategory">Custom Category Name</label>
            <input type="text" id="customCategory" placeholder="e.g. Health, News, VPN">
          </div>

          <div class="form-group">
            <label for="priority">Subscription Priority</label>
            <select id="priority">
              <option value="Essential">Essential (Cannot live without)</option>
              <option value="High Priority">High Priority (Use very frequently)</option>
              <option value="Medium Priority" selected>Medium Priority (Standard utility)</option>
              <option value="Low Priority">Low Priority (Rarely used)</option>
              <option value="Optional">Optional (Candidate for cancellation)</option>
            </select>
          </div>

          <div class="form-group">
            <label for="subCost">Cost (₹) <span style="color:var(--danger)">*</span></label>
            <input type="number" id="subCost" placeholder="649" min="0.01" step="0.01" required>
          </div>

          <div class="form-group">
            <label for="subCycle">Billing Cycle <span style="color:var(--danger)">*</span></label>
            <select id="subCycle" required>
              <option value="">Select billing cycle</option>
              <option value="Weekly">Weekly</option>
              <option value="Monthly" selected>Monthly</option>
              <option value="Quarterly">Quarterly</option>
              <option value="Yearly">Yearly</option>
            </select>
          </div>

          <div class="form-group">
            <label for="subRenewal">Next Renewal Date</label>
            <input type="date" id="subRenewal">
          </div>

          <div class="form-group">
            <label for="subPayment">Payment Method</label>
            <select id="subPayment">
              <option value="">Select payment method</option>
              <option value="Credit Card">Credit Card</option>
              <option value="Debit Card">Debit Card</option>
              <option value="UPI">UPI</option>
              <option value="Net Banking">Net Banking</option>
              <option value="PayPal">PayPal</option>
              <option value="Other">Other</option>
            </select>
          </div>

          <div class="form-group">
            <label for="subStatus">Status</label>
            <select id="subStatus">
              <option value="Active" selected>Active</option>
              <option value="Paused">Paused</option>
              <option value="Cancelled">Cancelled</option>
            </select>
          </div>

          <div class="form-group">
            <label for="subNotes">Notes</label>
            <textarea id="subNotes" rows="3" placeholder="Optional notes (e.g. renewal reminder, shared account info)..." style="resize:vertical;"></textarea>
          </div>

          <div style="display:flex;gap:12px;margin-top:8px;flex-wrap:wrap;">
            <button type="submit" id="saveSubBtn" class="btn btn-primary btn-lg" style="flex:1;">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
              Save Subscription
            </button>
            <a href="subscriptions.html" class="btn btn-secondary btn-lg">Cancel</a>
          </div>
        </form>
      </div>

    </div>
  </main>
</div>
<div id="toast" class="toast"></div>
<script src="script.js"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
  if (!requireLogin()) return;

  const categorySelect = document.getElementById("subCategory");
  const customGroup = document.getElementById("customCategoryGroup");
  categorySelect.addEventListener("change", function() {
    customGroup.style.display = this.value === "Other" ? "block" : "none";
  });

  // Check if editing existing subscription
  const params = new URLSearchParams(window.location.search);
  const editId = params.get("id");
  let existingSub = null;

  if (editId) {
    existingSub = getUserSubscriptions().find(s => s.id === editId);
    if (existingSub) {
      document.getElementById("formBadge").textContent = "Edit Subscription";
      document.getElementById("pageTitle").textContent = "Edit Subscription";
      document.getElementById("pageSubtitle").textContent = "Update details for " + (existingSub.name || "this subscription");
      document.getElementById("subName").value = existingSub.name || "";
      
      const knownCats = ["Entertainment", "Music", "Video Streaming", "Productivity", "Cloud Storage", "Gaming", "Fitness", "Education", "Shopping", "Finance", "Other"];
      if (knownCats.includes(existingSub.category)) {
        categorySelect.value = existingSub.category;
      } else {
        categorySelect.value = "Other";
        customGroup.style.display = "block";
        document.getElementById("customCategory").value = existingSub.category || "";
      }

      document.getElementById("subCost").value = existingSub.cost !== undefined ? existingSub.cost : existingSub.monthlyCost || "";
      document.getElementById("subCycle").value = existingSub.billingCycle || "Monthly";
      document.getElementById("subRenewal").value = existingSub.renewalDate || "";
      document.getElementById("subPayment").value = existingSub.paymentMethod || "";
      document.getElementById("subStatus").value = existingSub.status || "Active";
      document.getElementById("subNotes").value = existingSub.notes || "";
      document.getElementById("priority").value = existingSub.priority || "Medium Priority";
      document.getElementById("saveSubBtn").innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg> Update Subscription`;
    }
  }

  document.getElementById("subscriptionForm").addEventListener("submit", (e) => {
    e.preventDefault();
    const name = document.getElementById("subName").value.trim();
    let category = categorySelect.value;
    if (category === "Other") {
      const customVal = document.getElementById("customCategory").value.trim();
      if (customVal) category = customVal;
    }
    const cost = parseFloat(document.getElementById("subCost").value);
    const cycle = document.getElementById("subCycle").value;
    const err = document.getElementById("addError");

    if (!name || !category || isNaN(cost) || cost <= 0 || !cycle) {
      err.style.display = "block";
      err.textContent = "Please fill in all required fields with valid values.";
      return;
    }

    err.style.display = "none";
    const user = getCurrentUser();
    const monthlyCost = calculateMonthlyCost(cost, cycle);

    const sub = {
      id: editId || (existingSub && existingSub.id) || generateId(),
      userId: user.id,
      name,
      category,
      cost,
      billingCycle: cycle,
      monthlyCost,
      renewalDate: document.getElementById("subRenewal").value || "",
      paymentMethod: document.getElementById("subPayment").value || "",
      status: document.getElementById("subStatus").value || "Active",
      notes: document.getElementById("subNotes").value || "",
      priority: document.getElementById("priority").value || "Medium Priority",
      createdAt: (existingSub && existingSub.createdAt) || new Date().toISOString()
    };

    let subs = getUserSubscriptions();
    if (editId) {
      subs = subs.map(s => s.id === editId ? { ...s, ...sub } : s);
    } else {
      subs.push(sub);
    }

    saveUserSubscriptions(subs);
    showToast(editId ? "Subscription updated successfully!" : "Subscription added successfully!");
    setTimeout(() => {
      window.location.href = "subscriptions.html";
    }, 400);
  });
});
</script>
</body>
</html>
